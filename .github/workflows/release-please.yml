# Conventional-commit releases: watches main, maintains the version-bump PR
# ("chore(main): release X.Y.Z"). Merging that PR is the ship trigger — the
# release workflow listens for the merge commit (events created with
# GITHUB_TOKEN cannot trigger other workflows, so the tag itself can't be
# the trigger; the human merge can).
#
# feat: → minor, fix: → patch, ! / BREAKING CHANGE → major. Other types
# (chore/docs/ci/test) never trigger a release.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
