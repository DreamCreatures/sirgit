# Ships a tag: builds the release binary (with web/dist embedded — release
# rust-embed bakes it in at compile time, so the web build MUST come first),
# runs the full test suite, publishes the npm package, and attaches the
# binary + tarball to a GitHub Release.
#
# Prereq: repo secret NPM_TOKEN (npm "Automation" token — bypasses 2FA in CI).
name: release

on:
  push:
    tags: ['v*'] # the ship trigger: git tag vX.Y.Z && git push origin vX.Y.Z

jobs:
  release:
    runs-on: macos-latest # arm64 — matches the package's os/cpu guards
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@v5

      - name: resolve version from the tag
        id: v
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          test -n "$V"

      # The tag is the single version source: if package.json/Cargo.toml lag
      # behind, sync them, publish with the tag's version, and commit the
      # bump back to main (GITHUB_TOKEN pushes don't trigger workflows, so
      # no recursion). `git tag v0.1.2 && git push origin v0.1.2` just ships.
      - name: sync versions to the tag
        run: |
          V="${{ steps.v.outputs.version }}"
          if [ "$(jq -r .version package.json)" != "$V" ]; then
            jq --arg v "$V" '.version = $v' package.json > /tmp/pkg.json && mv /tmp/pkg.json package.json
            sed -i '' -E "s/^version = \".*\"/version = \"$V\"/" server/Cargo.toml
            git config user.name "release-bot" && git config user.email "release-bot@users.noreply.github.com"
            git add package.json server/Cargo.toml
            git commit -m "chore: release v$V (version sync from tag)"
            git push origin HEAD:main
          fi

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: enable pnpm via corepack (action-setup still targets Node 20)
        run: corepack enable && corepack prepare pnpm@12.9.1 --activate
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build # embedded into the binary by the step below
      - run: cargo test --manifest-path server/Cargo.toml

      - name: pack (prepack → cargo build --release → bin/sirgit)
        run: pnpm pack

      - name: npm publish
        run: npm publish --access public ./*.tgz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: GitHub Release (binary + npm tarball)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          files: |
            bin/sirgit
            *.tgz
          generate_release_notes: true
