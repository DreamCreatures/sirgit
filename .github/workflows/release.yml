# Ships a tag: builds the release binary (with web/dist embedded — release
# rust-embed bakes it in at compile time, so the web build MUST come first),
# runs the full test suite, publishes the npm package, and attaches the
# binary + tarball to a GitHub Release.
#
# Prereq: repo secret NPM_TOKEN (npm "Automation" token — bypasses 2FA in CI).
name: release

on:
  push:
    tags: ['v*'] # manual path: git tag vX.Y.Z && git push origin vX.Y.Z
    branches: [main] # auto path: merging the release-please PR lands
    # "chore(main): release X.Y.Z" on main — a real user push, so this
    # workflow fires (GITHUB_TOKEN-made tags couldn't trigger it)

jobs:
  release:
    runs-on: macos-latest # arm64 — matches the package's os/cpu guards
    permissions:
      contents: write # create the GitHub Release
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'chore(main): release'))
    steps:
      - uses: actions/checkout@v4

      - name: resolve version (tag ref, or package.json on release merges)
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then V="${GITHUB_REF_NAME#v}"; else V=$(jq -r .version package.json); fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          test -n "$V"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build # embedded into the binary by the step below
      - run: cargo test --manifest-path server/Cargo.toml

      - name: pack (prepack → cargo build --release → bin/sirgit)
        run: pnpm pack

      - name: npm publish
        run: npm publish --access public ./*.tgz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: GitHub Release (binary + npm tarball)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          files: |
            bin/sirgit
            *.tgz
          generate_release_notes: true
