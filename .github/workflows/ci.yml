name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - uses: pnpm/action-setup@v4 # reads packageManager from package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: web install
        run: pnpm --dir web install --frozen-lockfile

      - name: web build (rust-embed needs web/dist to EXIST at compile time)
        run: pnpm --dir web build

      - name: cargo test (gitx parsers, ops, delta on fixture repos)
        run: |
          set -o pipefail
          rustc --version && cargo --version
          cargo test --manifest-path server/Cargo.toml 2>&1 | tee /tmp/cargo-test.log || {
            # surface the actual error through the annotations API
            echo "::error::$(grep -m4 -E '^error|panicked at|test result: FAILED' /tmp/cargo-test.log | tr '\n' '|' | head -c 600)"
            exit 1
          }

      - name: vitest (ordering + lane algorithms)
        run: pnpm --dir web test

      - name: build server binary (e2e boots it via cargo run — prebuild so the 60s webServer timeout holds)
        run: cargo build --manifest-path server/Cargo.toml

      - name: playwright e2e (open → graph → stage → commit)
        run: |
          pnpm --dir web exec playwright install --with-deps chromium
          set -o pipefail
          pnpm --dir web exec playwright test 2>&1 | tee /tmp/e2e.log || {
            echo "::error::$(grep -m4 -E 'Error:|Timed out|✘|failed' /tmp/e2e.log | tr '\n' '|' | head -c 600)"
            exit 1
          }
