[package]
name = "sirgit"
version = "0.1.2"
edition = "2021"
description = "A fast, lightweight local git graph UI"

[[bin]]
name = "sirgit"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
notify = "8"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
open = "5"
dirs = "6"
mime_guess = "2"

[profile.release]
opt-level = 2
lto = true
strip = true
